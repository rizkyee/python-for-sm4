<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediksi Pengiriman Barang - Linear Regression</title>

<style>

body{
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#ff7a18,#ffb347);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:30px;
border-radius:12px;
width:420px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

label{
font-weight:bold;
}

input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
margin-top:15px;
border:none;
border-radius:8px;
background:#ff6b00;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#e85f00;
}

.result{
margin-top:20px;
padding:12px;
background:#f8f9fc;
border-radius:8px;
font-size:15px;
line-height:1.6;
}

</style>

</head>

<body>

<div class="container">

<h2>Estimasi Pengiriman Barang</h2>

<label>Masukkan Jarak Pengiriman (km)</label>

<input type="number" id="jarak" placeholder="Contoh: 80">

<button onclick="hitungPrediksi()">Hitung Estimasi</button>

<div class="result" id="hasil"></div>

</div>

<script>

// =============================
// DATA TRAINING 100 DATA
// =============================

let data = [

{x:50,y:1},{x:55,y:1},{x:60,y:1},{x:65,y:1},{x:70,y:1},
{x:75,y:1},{x:80,y:1},{x:85,y:1},{x:90,y:1},{x:95,y:1},

{x:100,y:2},{x:105,y:2},{x:110,y:2},{x:115,y:2},{x:120,y:2},
{x:125,y:2},{x:130,y:2},{x:135,y:2},{x:140,y:2},{x:145,y:2},

{x:150,y:2},{x:155,y:2},{x:160,y:2},{x:165,y:2},{x:170,y:2},
{x:175,y:2},{x:180,y:2},{x:185,y:2},{x:190,y:2},{x:195,y:2},

{x:200,y:3},{x:205,y:3},{x:210,y:3},{x:215,y:3},{x:220,y:3},
{x:225,y:3},{x:230,y:3},{x:235,y:3},{x:240,y:3},{x:245,y:3},

{x:250,y:3},{x:255,y:3},{x:260,y:3},{x:265,y:3},{x:270,y:3},
{x:275,y:3},{x:280,y:3},{x:285,y:3},{x:290,y:3},{x:295,y:3},

{x:300,y:4},{x:305,y:4},{x:310,y:4},{x:315,y:4},{x:320,y:4},
{x:325,y:4},{x:330,y:4},{x:335,y:4},{x:340,y:4},{x:345,y:4},

{x:350,y:4},{x:355,y:4},{x:360,y:4},{x:365,y:4},{x:370,y:4},
{x:375,y:4},{x:380,y:4},{x:385,y:4},{x:390,y:4},{x:395,y:4},

{x:400,y:5},{x:405,y:5},{x:410,y:5},{x:415,y:5},{x:420,y:5},
{x:425,y:5},{x:430,y:5},{x:435,y:5},{x:440,y:5},{x:445,y:5},

{x:450,y:5},{x:455,y:5},{x:460,y:5},{x:465,y:5},{x:470,y:5},
{x:475,y:5},{x:480,y:5},{x:485,y:5},{x:490,y:5},{x:495,y:5},

{x:500,y:6},{x:505,y:6},{x:510,y:6},{x:515,y:6},{x:520,y:6},
{x:525,y:6},{x:530,y:6},{x:535,y:6},{x:540,y:6},{x:545,y:6}

];

// =============================
// HITUNG MODEL REGRESI LINEAR
// =============================

function hitungModel(data){

let n = data.length;

let sumX = 0;
let sumY = 0;
let sumXY = 0;
let sumX2 = 0;

data.forEach(d=>{

sumX += d.x;
sumY += d.y;
sumXY += d.x * d.y;
sumX2 += d.x * d.x;

});

let b = (n*sumXY - sumX*sumY) / (n*sumX2 - sumX*sumX);

let a = (sumY - b*sumX) / n;

return {a,b};

}

let model = hitungModel(data);

// =============================
// FUNGSI PREDIKSI
// =============================

function hitungPrediksi(){

let x = parseFloat(document.getElementById("jarak").value);

if(isNaN(x) || x <= 0){

document.getElementById("hasil").innerHTML = "Masukkan jarak yang valid!";
return;

}

let y = model.a + model.b * x;

let hari = Math.round(y);

document.getElementById("hasil").innerHTML = `

<b>Jarak Pengiriman :</b> ${x} km
<br><br>

<b>Model Machine Learning :</b>
<br>
Y = a + bX
<br><br>

<b>Nilai Model :</b>
<br>
a = ${model.a.toFixed(3)}
<br>
b = ${model.b.toFixed(3)}
<br><br>

<b>Substitusi :</b>
<br>
Y = ${model.a.toFixed(3)} + (${model.b.toFixed(3)} × ${x})
<br><br>

<b>Perhitungan :</b>
<br>
Y = ${y.toFixed(3)}
<br><br>

<b>Estimasi Pengiriman :</b>
<br>
<b>${hari} Hari</b>

`;

}

</script>

</body>
</html>
