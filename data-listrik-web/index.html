<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediksi Penggunaan Listrik</title>
  <script src="https://cdn.tailwindcss.com"></script> <!-- Tailwind CSS CDN -->
  <link href="style.css" rel="stylesheet"> <!-- Optional Custom Styling -->
</head>
<body class="bg-gray-100">

  <!-- Halaman Utama -->
  <div id="landingPage" class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-r from-green-400 via-blue-500 to-indigo-600 text-white">
    <div class="text-center space-y-6">
      <h1 class="text-5xl font-extrabold tracking-wide sm:text-4xl md:text-5xl lg:text-6xl">Prediksi Penggunaan Listrik</h1>
      <p class="text-xl sm:text-lg md:text-xl">Cari tahu bagaimana cara Anda bisa menghemat energi dan biaya listrik!</p>
      <button onclick="goToPredictionPage()" class="bg-yellow-500 hover:bg-yellow-400 text-white px-8 py-3 rounded-full text-lg transition duration-300 transform hover:scale-105">
        Coba Prediksi Sekarang
      </button>
    </div>
  </div>

  <!-- Halaman Prediksi -->
  <div id="predictionPage" class="hidden min-h-screen bg-gradient-to-r from-indigo-600 via-blue-500 to-green-400 flex flex-col items-center justify-center text-white space-y-8 p-6">
    <h1 class="text-4xl font-bold sm:text-3xl md:text-4xl">Prediksi Penggunaan Listrik Anda</h1>

    <!-- Daya Listrik Slider -->
    <div class="w-full max-w-md px-4">
      <label for="daya-listrik" class="block text-lg font-medium">Daya Listrik (VA)</label>
      <input 
        id="daya-listrik" 
        type="range" 
        min="500" 
        max="3500" 
        step="100"
        class="w-full h-2 bg-gray-300 rounded-lg"
        onchange="updateDayaListrik(this.value)"
      />
      <p id="daya-listrik-value" class="text-center text-xl">1000 VA</p>
    </div>

    <!-- Pemakaian kWh Slider -->
    <div class="w-full max-w-md px-4">
      <label for="pemakaian" class="block text-lg font-medium">Pemakaian (kWh)</label>
      <input 
        id="pemakaian" 
        type="range" 
        min="50" 
        max="400" 
        step="10"
        class="w-full h-2 bg-gray-300 rounded-lg"
        onchange="updatePemakaian(this.value)"
      />
      <p id="pemakaian-value" class="text-center text-xl">100 kWh</p>
    </div>

    <!-- Button Prediksi -->
    <button 
      onclick="predict()" 
      class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 rounded-lg text-xl transition duration-300 transform hover:scale-105"
    >
      Prediksi
    </button>

    <!-- Hasil Prediksi -->
    <div id="result" class="mt-8 hidden">
      <div id="result-message" class="py-4 px-6 rounded-lg text-2xl font-bold text-white">
        <!-- Pesan Hasil -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
