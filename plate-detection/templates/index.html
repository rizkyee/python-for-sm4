<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Plate Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        h2 {
            font-weight: 800;
            margin-top: 0;
            letter-spacing: -0.025em;
            font-size: 28px;
            background: linear-gradient(to right, #4f46e5, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* Custom File Upload */
        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="file"] {
            border: 2px dashed #cbd5e1;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        input[type="file"]:hover {
            border-color: var(--primary);
            background: #f5f3ff;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Result Section */
        .result-area {
            margin-top: 35px;
            padding-top: 30px;
            border-top: 1px solid #f1f5f9;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ocr-label {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: block;
        }

        .ocr-result {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 4px;
            margin: 10px 0 25px 0;
            font-variant-numeric: tabular-nums;
        }

        .img-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            line-height: 0;
        }

        img {
            width: 100%;
            height: auto;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        img:hover {
            opacity: 1;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #dcfce7;
            color: #15803d;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>AI Plate Scanner</h2>
            <p>Unggah foto kendaraan untuk ekstraksi nomor plat secara otomatis.</p>

            <form method="POST" enctype="multipart/form-data">
                <div class="file-input-wrapper">
                    <input type="file" name="image" accept="image/*" required>
                </div>
                <button type="submit">Mulai Analisis</button>
            </form>

            {% if text %}
            <div class="result-area">
                <span class="badge">Analisis Berhasil</span>
                <span class="ocr-label">Nomor Terdeteksi</span>
                <div class="ocr-result">{{ text }}</div>
                
                {% if image %}
                    <span class="ocr-label">Visualisasi AI</span>
                    <div class="img-container">
                        <img src="{{ image }}" alt="Hasil Crop">
                    </div>
                {% endif %}
            </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
